name: Bump & Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs a recent npm CLI — the latest npm major
      # also requires Node 22+, which is why Node itself was bumped above.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Git user
        run: |
          git config user.name "decky-ui-kit CI"
          git config user.email "ci@decky-ui-kit"

      - name: Bump version and create git tag
        run: |
          npm version ${{ github.event.inputs.bump }} -m "chore(release): v%s"

      # Publish before pushing anything — if this fails (trusted publisher
      # not configured yet, name taken, etc.) the release attempt can just
      # be fixed and rerun without any git state having been pushed yet.
      # No token: npm's CLI detects the GitHub Actions OIDC context and
      # exchanges it for a short-lived publish credential automatically,
      # provided the trusted publisher is configured on npmjs.com for this
      # exact repo + workflow file.
      - name: Publish to npm
        run: npm publish

      - name: Push commit and tag
        run: git push origin HEAD --follow-tags

      # A tag pushed here with the default GITHUB_TOKEN does NOT trigger
      # pages.yml's own "push: tags" event (GitHub blocks token-authored
      # pushes from starting new workflow runs, to prevent infinite loops)
      # — so the versioned docs deploy has to happen right here instead of
      # relying on that trigger.
      - name: Read new version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build demo for this version
        run: npm run demo:build
        env:
          DEMO_VERSION_SEGMENT: ${{ steps.version.outputs.version }}

      - name: Prepare gh-pages worktree
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-worktree origin/gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages-worktree
          fi

      - name: Publish this version's docs
        run: node scripts/publish-docs.mjs gh-pages-worktree
        env:
          DEMO_VERSION_SEGMENT: ${{ steps.version.outputs.version }}
          IS_RELEASE: "true"

      - name: Commit and push docs
        working-directory: gh-pages-worktree
        run: |
          git add -A
          git commit -m "docs: publish ${{ steps.version.outputs.version }}" || echo "Nothing to commit"
          git push origin HEAD:gh-pages
